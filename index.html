<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácoras de Rosario · FCPOLIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<style>
  /* Paleta institucional (Manual de Identidad Visual FCPOLIT 2023) */
  :root { --violeta:#724195; --lila:#C0A7F1; --gris:#545454; --lila-suave:#efe9fb; --line:#e4dcef; --bg:#ffffff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:Inter, system-ui, sans-serif; font-weight:500; background:var(--bg); color:var(--gris); display:flex; flex-direction:column; }
  .display { font-family:"Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight:400; letter-spacing:.02em; }

  header { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); }
  .sello { width:64px; height:64px; background:var(--violeta); color:#fff; display:flex; align-items:flex-end; padding:0 6px 5px; font-size:1.55rem; line-height:1; flex:none; }
  header h1 { margin:0; font-size:2.1rem; line-height:1; color:var(--violeta); }
  header p { margin:5px 0 0; font-size:.82rem; font-weight:400; }

  main { flex:1; display:flex; min-height:0; }
  aside { width:390px; max-width:45%; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .filters { padding:12px 16px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .filters input, .filters select { width:100%; padding:8px 9px; font:inherit; font-size:.85rem; border:1px solid var(--line); border-radius:0; background:#fff; color:var(--gris); }
  .filters input { grid-column:1 / -1; }
  .filters select.full { grid-column:1 / -1; }
  .filters :focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--violeta); outline-offset:2px; }
  .count { padding:6px 16px 10px; font-size:.78rem; display:flex; justify-content:space-between; border-bottom:1px solid var(--line); }
  .count button { background:none; border:none; color:var(--violeta); cursor:pointer; font:inherit; font-weight:600; padding:0; }
  #list { overflow-y:auto; flex:1; }
  .item { border-bottom:1px solid var(--line); padding:13px 16px; cursor:pointer; border-left:4px solid transparent; }
  .item:hover { background:var(--lila-suave); }
  .item.open { border-left-color:var(--violeta); background:var(--lila-suave); }
  .item h3 { margin:0 0 3px; font-size:1.45rem; line-height:1.05; color:var(--violeta); }
  .meta { font-size:.78rem; font-weight:400; }
  .tag { display:inline-block; font-size:.72rem; background:var(--lila-suave); color:var(--gris); padding:2px 9px; margin:7px 5px 0 0; }
  .item.open .tag { background:#fff; }
  .detail { display:none; margin-top:10px; font-size:.9rem; line-height:1.5; font-weight:400; }
  .item.open .detail { display:block; }
  .btn, .leaflet-popup-content a.btn { display:inline-block; background:var(--violeta); color:#fff; text-decoration:none; font-size:.82rem; font-weight:600; padding:7px 14px; }
  .btn:hover { background:#5b3277; }
  #map { flex:1; }
  .empty { padding:20px 16px; font-size:.9rem; }
  .leaflet-popup-content { font-family:Inter, sans-serif; font-weight:400; color:var(--gris); margin:14px 16px; }
  .leaflet-popup-content .display { font-size:1.35rem; line-height:1.05; color:var(--violeta); display:block; }
  .leaflet-popup-content-wrapper { border-radius:0; }
  .leaflet-popup-tip { border-radius:0; }
  @media (max-width:760px) {
    main { flex-direction:column-reverse; }
    aside { width:100%; max-width:none; height:50%; border-right:none; border-top:1px solid var(--line); }
    #map { height:50%; flex:none; }
    header h1 { font-size:1.6rem; } .sello { width:52px; height:52px; font-size:1.25rem; }
  }
</style>
</head>
<body>
<header>
  <div class="sello display" aria-hidden="true">FCPOLIT</div>
  <div>
    <h1 class="display">Bitácoras · Problemas Sociales Contemporáneos II</h1>
    <p>Trabajos finales PSCII, Licenciatura en Seguridad Ciudadana · Facultad de Ciencia Política y Relaciones Internacionales, UNR</p>
  </div>
</header>
<main>
  <aside>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar por título, autor/a o palabra clave…" aria-label="Buscar">
      <select id="fAnio" aria-label="Año"></select>
      <select id="fCat" aria-label="Categoría"></select>
      <select id="fArea" class="full" aria-label="Área"></select>
    </div>
    <div class="count"><span id="n"></span><button id="reset">Limpiar filtros</button></div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
</main>

<script>
/* ============================================================
   DATOS: un objeto por trabajo.
   Link: idealmente guardado en el Drive de la cátedra.
   ============================================================ */
const TRABAJOS = [
  { titulo:"Cuando la ciudad cambia de reglas. Informalidad validada en los días de partido en Arroyito", autores:["Alemán Urquiza, Ximena"], anio:2025, categoria:"Espacio público", area:"Arroyito",
    lat:-32.9138570592545, lng:-60.6745589678938, resumen:"El barrio de Arroyito se transforma radicalmente en días de partido y los eventos habilitan prácticas que en otro momento serían sancionadas. ¿Cómo convivir con lo informal?", link:"https://docs.google.com/presentation/d/e/2PACX-1vQM7KzTKRM66D_W3YSxrX0xhXhrXDUq0JuW75oH7xbo7vUA-X63nDlcDG-ceQ-YAZI4uoarV2mxnqH0/pub?start=false&slide=id.g3adae92b7da_0_0" },
  { titulo:"Plaza López: entre la convivencia, la apropiación y los imaginarios urbanos", autores:["Boeri, Florencia"], anio:2025, categoria:"Espacio público", area:"República de la Sexta",
    lat:-32.95876093480876, lng:-60.636124860481466, resumen:"Observaciones de un microescenario urbano, donde se superponen prácticas diversas: paseo familiar, actividad física, ferias y permanencia de personas en situación de calle.", link:"https://drive.google.com/file/d/1SSuT53-keqFIa7iGn3qdgkt5_lpslvZT/view?usp=drive_link" },
  { titulo:"Mobiliario urbano: intersección de Av. Soldado Aguirre y Av. Cafferata", autores:["Casterllarin, Candela"], anio:2025, categoria:"Espacio público", area:"Villa Gobernador Gálvez",
    lat:-33.029291529804226, lng:-60.641296985457366, resumen:"Punto clave, que reúne parada de transporte público, comercio y tránsito peatonal y vehicular, la intersección permite apreciar cómo funciona la ciudad en un espacio reducido.", link:"https://drive.google.com/file/d/1JhJsxuF-ifdNafQQT4tnYEgqYxXr0tfS/view?usp=drive_link" },
  { titulo:"Visibilidad mediática y conflictividad urbana: la cuadra de Sarmiento 4300", autores:["Kraus, Lucía"], anio:2025, categoria:"Marginalidad urbana y estigmas", area:"Barrio Matheu",
    lat:-32.98702888069093, lng:-60.648366845822636, resumen:"Espacio de alta visibilidad mediática y comunitaria, en el que se rastrea la convergencia de problemáticas relacionadas con la seguridad, la educación, el derecho a la ciudad y la convivencia ciudadana.", link:"https://www.canva.com/design/DAG4g2ahWUY/AQm8zCHRu3UusKmt4whwHw/view#1" },
  { titulo:"El espacio público desde la perspectiva de recolectores informales y personas en situación de calle", autores:["Risso, Yuliana"], anio:2025, categoria:"Marginalidad urbana y estigmas", area:"Parque Alvear",
    lat:-32.973720363484226, lng:-60.67511006789113, resumen:"¿Cómo se relacionan las personas en situación de calle y los recolectores informales con el espacio público? Una reflexión sobre desigualdades y dinámicas socio-urbanas.", link:"https://padlet.com/rmkk55gp4k/bitacora-urbana-13fcjbfv0ysvrzwx" },
  { titulo:"Avenida Dante Alighieri: Modernización y entorno urbano", autores:["Vizzo, María José"], anio:2025, categoria:"Espacio público", area:"Barrio Parque",
    lat:-32.96027792963219, lng:-60.66202536789166, resumen:"Punto clave de la modernización urbana de la ciudad, donde conviven usos recreativos, deportivos y comerciales, evidenciando tensiones propias del desarrollo urbano contemporáneo.", link:"https://view.genially.com/690e6cef5d8667cad99864a9" }
];

const VIOLETA = "#724195", LILA = "#C0A7F1";
const base = { radius:9, color:"#fff", weight:2, fillColor:VIOLETA, fillOpacity:1 };
const activo = { radius:13, color:VIOLETA, weight:3, fillColor:LILA, fillOpacity:1 };

const map = L.map("map").setView([-32.9468, -60.6393], 12);
/* Mapa base: OpenFreeMap (sin API key). Si el navegador no soporta WebGL, cae a OpenStreetMap. */
const ATTR = '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Datos de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
function webglOk() { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } }
if (window.maplibregl && L.maplibreGL && webglOk()) {
  L.maplibreGL({ style:"https://tiles.openfreemap.org/styles/positron", attribution:ATTR }).addTo(map);
} else {
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:"&copy; colaboradores de <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>"
  }).addTo(map);
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function fillSelect(el, label, values) {
  el.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
}
const uniq = k => [...new Set(TRABAJOS.map(t => t[k]))].sort();
fillSelect($("fAnio"), "Todos los años", uniq("anio").reverse());
fillSelect($("fCat"), "Todas las categorías", uniq("categoria"));
fillSelect($("fArea"), "Todas las áreas", uniq("area"));

const markers = new Map();
const layer = L.layerGroup().addTo(map);

const ficha = t => `<span class="display">${esc(t.titulo)}</span>
  <div class="meta">${esc(t.autores.join(", "))} · ${t.anio}</div>
  <p>${esc(t.resumen)}</p><a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">Abrir trabajo →</a>`;

TRABAJOS.forEach((t, i) => {
  const m = L.circleMarker([t.lat, t.lng], base);
  m.bindPopup(ficha(t));
  m.on("click", () => abrir(i, false));
  markers.set(i, m);
});

function abrir(i, abrirPopup = true) {
  markers.forEach(m => m.setStyle(base));
  const m = markers.get(i);
  m.setStyle(activo); m.bringToFront();
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("open", el.dataset.i == i));
  const el = document.querySelector(`.item[data-i="${i}"]`);
  if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
  if (abrirPopup) {
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration:.6 });
    m.openPopup();
  }
}

function render() {
  const q = norm($("q").value), a = $("fAnio").value, c = $("fCat").value, b = $("fArea").value;
  const res = TRABAJOS.map((t, i) => ({ t, i })).filter(({ t }) =>
    (!a || t.anio == a) && (!c || t.categoria === c) && (!b || t.area === b) &&
    (!q || norm([t.titulo, t.autores.join(" "), t.resumen, t.area, t.categoria].join(" ")).includes(q))
  );
  layer.clearLayers();
  markers.forEach(m => m.setStyle(base));
  res.forEach(({ i }) => layer.addLayer(markers.get(i)));
  $("n").textContent = `${res.length} de ${TRABAJOS.length} trabajos`;
  $("list").innerHTML = res.length ? res.map(({ t, i }) => `
    <div class="item" data-i="${i}">
      <h3 class="display">${esc(t.titulo)}</h3>
      <div class="meta">${esc(t.autores.join(", "))} · ${t.anio}</div>
      <span class="tag">${esc(t.categoria)}</span><span class="tag">${esc(t.area)}</span>
      <div class="detail"><p>${esc(t.resumen)}</p><a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">Abrir trabajo →</a></div>
    </div>`).join("") : `<div class="empty">Ningún trabajo coincide con los filtros.</div>`;
  document.querySelectorAll(".item").forEach(el =>
    el.addEventListener("click", e => { if (e.target.tagName !== "A") abrir(+el.dataset.i); }));
  if (res.length) map.fitBounds(L.latLngBounds(res.map(({ t }) => [t.lat, t.lng])).pad(.3), { maxZoom:15 });
}

["q","fAnio","fCat","fArea"].forEach(id => $(id).addEventListener("input", render));
$("reset").addEventListener("click", () => { ["q","fAnio","fCat","fArea"].forEach(id => $(id).value = ""); render(); });
render();
</script>
</body>
</html>
